services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: colocare
      POSTGRES_PASSWORD: colocare
      POSTGRES_DB: colocare
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U colocare"]
      interval: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://colocare:colocare@db:5432/colocare
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
